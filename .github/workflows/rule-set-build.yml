name: Fetch, Convert and Push SRS (Smart Split & Dual Files)

on:
  push:
    branches:
      - main
    paths:
      - 'subscriptions*.txt'     # 只要是以 subscriptions 开头的 txt 变动都会触发
      - '.github/workflows/**'
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: pip install pyyaml requests

      - name: Install Latest sing-box
        run: |
          LATEST_URL=$(curl -sL https://api.github.com/repos/SagerNet/sing-box/releases/latest | grep "browser_download_url" | grep "linux-amd64.tar.gz" | cut -d '"' -f 4)
          wget -qO sing-box.tar.gz $LATEST_URL
          tar -xzf sing-box.tar.gz
          sudo mv sing-box-*/sing-box /usr/local/bin/

      - name: Process URLs and Convert to JSON
        run: |
          mkdir -p sing-box/geosite sing-box/geoip
          
          cat << 'EOF' > convert.py
          import os, json, yaml, requests

          DIR_SITE = "sing-box/geosite"
          DIR_IP = "sing-box/geoip"

          SITE_KEYS = {"domain_suffix", "domain", "domain_keyword", "domain_regex", "process_name"}
          IP_KEYS = {"ip_cidr", "source_ip_cidr", "port", "source_port"}

          def process_url(name, url):
              print(f"Downloading {name}...")
              try:
                  resp = requests.get(url, timeout=15)
                  resp.raise_for_status()
                  content = resp.text
              except Exception as e:
                  print(f"Error downloading {name}: {e}")
                  return
                  
              # 1. 尝试按原生 JSON 格式拆解
              try:
                  data = json.loads(content)
                  if "rules" in data:
                      site_rules_list = []
                      ip_rules_list = []
                      for rule in data["rules"]:
                          site_dict = {k: v for k, v in rule.items() if k in SITE_KEYS}
                          ip_dict = {k: v for k, v in rule.items() if k in IP_KEYS}
                          if site_dict: site_rules_list.append(site_dict)
                          if ip_dict: ip_rules_list.append(ip_dict)
                      
                      if site_rules_list:
                          with open(f"{DIR_SITE}/{name}.json", "w", encoding="utf-8") as f:
                              json.dump({"version": 2, "rules": site_rules_list}, f, indent=2, ensure_ascii=False)
                          print(f"-> [{name}] (JSON) Extracted Domains to geosite.")
                      if ip_rules_list:
                          with open(f"{DIR_IP}/{name}.json", "w", encoding="utf-8") as f:
                              json.dump({"version": 2, "rules": ip_rules_list}, f, indent=2, ensure_ascii=False)
                          print(f"-> [{name}] (JSON) Extracted IPs to geoip.")
                      return
              except json.JSONDecodeError:
                  pass
                  
              # 2. 按 YAML 或纯文本 LIST 格式拆解
              try:
                  data = yaml.safe_load(content)
                  if isinstance(data, dict) and "payload" in data:
                      payload = data["payload"]
                  else:
                      payload = [line for line in content.splitlines() if line.strip() and not line.strip().startswith("#")]
              except yaml.YAMLError:
                  payload = [line for line in content.splitlines() if line.strip() and not line.strip().startswith("#")]

              mapping = {
                  "DOMAIN-SUFFIX": "domain_suffix",
                  "DOMAIN": "domain",
                  "DOMAIN-KEYWORD": "domain_keyword",
                  "DOMAIN-REGEX": "domain_regex",
                  "PROCESS-NAME": "process_name",
                  "IP-CIDR": "ip_cidr",
                  "IP-CIDR6": "ip_cidr",
                  "SRC-IP-CIDR": "source_ip_cidr",
                  "DST-PORT": "port",
                  "SRC-PORT": "source_port"
              }

              site_rules = {}
              ip_rules = {}

              for line in payload:
                  line = str(line).strip()
                  if not line or line.startswith("#"): continue
                  parts = [p.strip() for p in line.split(',', 1)]
                  if len(parts) >= 2:
                      r_type, r_val = parts[0].upper(), parts[1]
                      r_val = r_val.split(',')[0].strip() 
                      
                      if r_type in mapping:
                          key = mapping[r_type]
                          # 智能归类：该去哪去哪，绝不丢弃
                          if key in SITE_KEYS:
                              site_rules.setdefault(key, []).append(r_val)
                          elif key in IP_KEYS:
                              ip_rules.setdefault(key, []).append(r_val)

              # 3. 分别写入对应的文件夹
              if site_rules:
                  with open(f"{DIR_SITE}/{name}.json", "w", encoding="utf-8") as f:
                      json.dump({"version": 2, "rules": [site_rules]}, f, indent=2, ensure_ascii=False)
                  print(f"-> [{name}] Domains saved to geosite.")
                  
              if ip_rules:
                  with open(f"{DIR_IP}/{name}.json", "w", encoding="utf-8") as f:
                      json.dump({"version": 2, "rules": [ip_rules]}, f, indent=2, ensure_ascii=False)
                  print(f"-> [{name}] IPs saved to geoip.")

              if not site_rules and not ip_rules:
                  print(f"-> [{name}] No valid rules extracted.")

          # 自动读取当前目录下所有你能想到的 txt 配置文件
          config_files = ["subscriptions_domain.txt", "subscriptions_ip.txt", "subscriptions.txt"]
          
          for cfg in config_files:
              if os.path.exists(cfg):
                  print(f"\n=== Processing {cfg} ===")
                  with open(cfg, "r", encoding="utf-8") as f:
                      for line in f:
                          line = line.strip()
                          if line and not line.startswith("#") and "," in line:
                              name, url = line.split(",", 1)
                              process_url(name.strip(), url.strip())
          EOF
          
          python convert.py

      - name: Compile JSON to SRS
        run: |
          for DIR in "sing-box/geosite" "sing-box/geoip"; do
            if [ -d "$DIR" ]; then
              for file in "$DIR"/*.json; do
                if [ -f "$file" ]; then
                  name=$(basename "$file" .json)
                  sing-box rule-set compile "$file" -o "$DIR/${name}.srs"
                fi
              done
            fi
          done

      - name: Commit and Push Changes
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add sing-box/geosite/ sing-box/geoip/
          
          if git status --porcelain | grep -q "^[AMU]"; then
            git commit -m "Auto-update & Smart Split rules [skip ci]"
            git push origin main
            echo "Changes pushed to repository successfully."
          else
            echo "No changes detected, skipping commit."
          fi
