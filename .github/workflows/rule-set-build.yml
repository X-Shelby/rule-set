name: Fetch, Convert and Push SRS

on:
  push:
    branches:
      - main
    paths:
      - 'subscriptions*.txt'
      - 'subscriptions*.yaml'
      - 'subscriptions*.yml'
      - '.github/workflows/**'

  schedule:
    - cron: '0 2 * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          pip install pyyaml requests
      - name: Install Latest sing-box
        run: |
          LATEST_URL=$(curl -sL \
            https://api.github.com/repos/SagerNet/sing-box/releases/latest \
            | grep "browser_download_url" \
            | grep "linux-amd64.tar.gz" \
            | cut -d '"' -f 4 \
            | head -n 1)

          wget -qO sing-box.tar.gz "$LATEST_URL"

          tar -xzf sing-box.tar.gz

          sudo mv sing-box-*/sing-box /usr/local/bin/

          # 清理临时文件
          rm -rf sing-box.tar.gz sing-box-*/

          sing-box version

      - name: Process Subscriptions
        run: |
          # 不再暴力清空目录，仅确保目录存在
          mkdir -p sing-box/geosite
          mkdir -p sing-box/geoip

          cat > convert.py <<'PY'
          import os
          import json
          import yaml
          import requests


          SITE_DIR = "sing-box/geosite"
          IP_DIR = "sing-box/geoip"


          SITE_KEYS = {
              "domain",
              "domain_suffix",
              "domain_keyword",
              "domain_regex",
              "process_name"
          }

          IP_KEYS = {
              "ip_cidr",
              "source_ip_cidr",
              "port",
              "source_port"
          }


          MAPPING = {
              "DOMAIN": "domain",
              "DOMAIN-SUFFIX": "domain_suffix",
              "DOMAIN-KEYWORD": "domain_keyword",
              "DOMAIN-REGEX": "domain_regex",

              "PROCESS-NAME": "process_name",

              "IP-CIDR": "ip_cidr",
              "IP-CIDR6": "ip_cidr",

              "SRC-IP-CIDR": "source_ip_cidr",

              "DST-PORT": "port",
              "SRC-PORT": "source_port"
          }

          # 全局记录当前有效的所有规则名称
          VALID_NAMES = set()


          def download(url):
              print(f"Downloading: {url}")

              r = requests.get(
                  url,
                  timeout=30,
                  headers={
                      "User-Agent": "Mozilla/5.0"
                  }
              )

              r.raise_for_status()

              return r.text


          def parse_json(content):
              try:
                  data = json.loads(content)

                  if isinstance(data, dict):
                      if "rules" in data:
                          return data["rules"]

                      if "payload" in data:
                          return data["payload"]

                  if isinstance(data, list):
                      return data

              except Exception:
                  pass

              return None


          def parse_yaml(content):
              try:
                  data = yaml.safe_load(content)

                  if isinstance(data, dict):

                      # Clash Rule Provider
                      if "payload" in data:
                          return data["payload"]

                      # 某些规则集使用 rules
                      if "rules" in data:
                          return data["rules"]

                  if isinstance(data, list):
                      return data

              except Exception:
                  pass

              return None


          def parse_text(content):
              return [
                  line.strip()
                  for line in content.splitlines()
                  if line.strip()
                  and not line.strip().startswith("#")
              ]


          def parse_content(content):
              # JSON
              rules = parse_json(content)

              if rules is not None:
                  print("Detected: JSON")
                  return rules

              # YAML
              rules = parse_yaml(content)

              if rules is not None:
                  print("Detected: YAML")
                  return rules

              # TXT
              print("Detected: TXT")

              return parse_text(content)


          def add_rule(rule_dict, rule_type, value):

              if not value:
                  return

              key = MAPPING.get(rule_type.upper())

              if not key:
                  return

              rule_dict.setdefault(key, []).append(value)


          def convert_rules(rules):

              site_rules = {}
              ip_rules = {}

              for item in rules:

                  if isinstance(item, dict):

                      # sing-box 原生规则
                      for key, value in item.items():

                          if key in SITE_KEYS:
                              if isinstance(value, list):
                                  site_rules.setdefault(key, []).extend(value)
                              else:
                                  site_rules.setdefault(key, []).append(value)

                          elif key in IP_KEYS:
                              if isinstance(value, list):
                                  ip_rules.setdefault(key, []).extend(value)
                              else:
                                  ip_rules.setdefault(key, []).append(value)

                      continue


                  if not isinstance(item, str):
                      continue

                  line = item.strip()

                  if not line or line.startswith("#"):
                      continue

                  # Clash 格式
                  parts = [x.strip() for x in line.split(",")]

                  rule_type = parts[0].upper()

                  if rule_type in MAPPING:

                      if len(parts) < 2:
                          continue

                      value = parts[1].strip()

                      if not value:
                          continue

                      if rule_type in {
                          "IP-CIDR",
                          "IP-CIDR6",
                          "SRC-IP-CIDR"
                      }:

                          add_rule(
                              ip_rules,
                              rule_type,
                              value
                          )

                      else:

                          add_rule(
                              site_rules,
                              rule_type,
                              value
                          )

                      continue

                  # 纯域名格式
                  if (
                      "." in line
                      and "," not in line
                      and "/" not in line
                  ):

                      site_rules.setdefault(
                          "domain_suffix",
                          []
                      ).append(line)

              return site_rules, ip_rules


          def save_json(path, rules):

              if not rules:
                  return False

              # 去重
              for key in rules:
                  rules[key] = list(
                      dict.fromkeys(rules[key])
                  )

              data = {
                  "version": 2,
                  "rules": [rules]
              }

              with open(
                  path,
                  "w",
                  encoding="utf-8"
              ) as f:

                  json.dump(
                      data,
                      f,
                      indent=2,
                      ensure_ascii=False
                  )

              return True


          def process(name, url, mode="split"):

              print()
              print("=" * 60)
              print(f"Processing: {name}")
              print(f"Mode: {mode}")
              print("=" * 60)

              try:
                  content = download(url)

              except Exception as e:

                  print(
                      f"Download failed: {e}"
                  )

                  return


              try:
                  rules = parse_content(content)

                  if not rules:

                      print(
                          f"[{name}] No rules found"
                      )

                      return

                  print(
                      f"[{name}] Raw rules: {len(rules)}"
                  )

                  site_rules, ip_rules = convert_rules(
                      rules
                  )

                  if mode == "mixed":

                      mixed = {}

                      mixed.update(site_rules)
                      mixed.update(ip_rules)

                      if save_json(
                          f"{SITE_DIR}/{name}.json",
                          mixed
                      ):

                          print(
                              f"[{name}] "
                              f"Mixed JSON generated"
                          )

                  else:

                      if save_json(
                          f"{SITE_DIR}/{name}.json",
                          site_rules
                      ):

                          print(
                              f"[{name}] "
                              f"Geosite JSON generated"
                          )

                      if save_json(
                          f"{IP_DIR}/{name}.json",
                          ip_rules
                      ):

                          print(
                              f"[{name}] "
                              f"GeoIP JSON generated"
                          )

              except Exception as e:

                  print(
                      f"[{name}] "
                      f"Processing error: {e}"
                  )


          def process_config_file(path):

              print()
              print(
                  f"### Config: {path}"
              )

              ext = os.path.splitext(path)[1].lower()

              # 默认 split
              mode = "split"

              # subscriptions.txt 保持混合模式
              if os.path.basename(path) == "subscriptions.txt":
                  mode = "mixed"

              try:

                  with open(
                      path,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      lines = f.readlines()

              except Exception as e:

                  print(
                      f"Cannot read {path}: {e}"
                  )

                  return


              for line in lines:

                  line = line.strip()

                  if (
                      not line
                      or line.startswith("#")
                  ):
                      continue

                  if "," in line:
                      name, url = line.split(",", 1)
                  elif "=" in line:
                      name, url = line.split("=", 1)
                  else:
                      continue

                  name = name.strip()
                  url = url.strip()

                  if not name or not url:
                      continue

                  # 将有效配置文件的名字记录下来
                  VALID_NAMES.add(name)

                  process(
                      name,
                      url,
                      mode
                  )

          def cleanup_obsolete_files():
              print("\n=== Cleanup Obsolete Files ===")
              for directory in [SITE_DIR, IP_DIR]:
                  if not os.path.exists(directory):
                      continue
                  for filename in os.listdir(directory):
                      if filename.endswith(".json") or filename.endswith(".srs"):
                          # 获取不带后缀的文件名
                          base_name = os.path.splitext(filename)[0]
                          # 如果该文件不在有效名单内，则删除
                          if base_name not in VALID_NAMES:
                              filepath = os.path.join(directory, filename)
                              try:
                                  os.remove(filepath)
                                  print(f"Removed obsolete file: {filepath}")
                              except Exception as e:
                                  print(f"Failed to remove {filepath}: {e}")

          # ================= 执行逻辑 =================
          
          # 自动扫描 subscriptions*.txt/yaml/yml
          files = sorted(
              f for f in os.listdir(".")
              if (
                  f.startswith("subscriptions")
                  and f.endswith(
                      (".txt", ".yaml", ".yml")
                  )
              )
          )

          print(
              f"Found config files: {files}"
          )

          for file in files:
              process_config_file(file)

          # 下载和转换全部完成后，执行精准清理
          cleanup_obsolete_files()

          PY

          python convert.py

      - name: Compile JSON to SRS
        run: |
          for DIR in "sing-box/geosite" "sing-box/geoip"; do
            if [ -d "$DIR" ]; then
              for file in "$DIR"/*.json; do
                if [ -f "$file" ]; then
                  name=$(basename "$file" .json)

                  echo "Compiling: $file"

                  sing-box rule-set compile \
                    "$file" \
                    -o "$DIR/${name}.srs"
                fi
              done
            fi
          done

      - name: Commit and Push Changes
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # 使用 -A 参数，记录文件的修改、新增以及精准删除状态
          git add -A sing-box/geosite/ sing-box/geoip/

          if git diff --cached --quiet; then
            echo "No changes detected, skipping commit."
            exit 0
          fi

          git commit -m "Auto-update rule sets and cleanup obsolete files [skip ci]"

          git push origin main

          echo "Changes pushed successfully."
