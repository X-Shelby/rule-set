name: Fetch, Convert and Push SRS

on:
  push:
    branches:
      - main
    paths:
      - 'subscriptions*.txt'
      - 'subscriptions*.yaml'
      - 'subscriptions*.yml'
      - '.github/workflows/**'

  schedule:
    - cron: '0 2 * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          pip install pyyaml requests

      - name: Install Latest sing-box
        run: |
          LATEST_URL=$(curl -sL \
            https://api.github.com/repos/SagerNet/sing-box/releases/latest \
            | grep "browser_download_url" \
            | grep "linux-amd64.tar.gz" \
            | cut -d '"' -f 4 \
            | head -n 1)

          wget -qO sing-box.tar.gz "$LATEST_URL"
          tar -xzf sing-box.tar.gz
          sudo mv sing-box-*/sing-box /usr/local/bin/
          
          # 清理临时文件
          rm -rf sing-box.tar.gz sing-box-*/
          sing-box version

      - name: Process Subscriptions
        run: |
          mkdir -p sing-box/geosite
          mkdir -p sing-box/geoip

          cat > convert.py <<'PY'
          import os
          import json
          import yaml
          import requests
          import time

          SITE_DIR = "sing-box/geosite"
          IP_DIR = "sing-box/geoip"

          SITE_KEYS = {
              "domain", "domain_suffix", "domain_keyword",
              "domain_regex", "process_name"
          }

          IP_KEYS = {
              "ip_cidr", "source_ip_cidr", "port", "source_port"
          }

          MAPPING = {
              "DOMAIN": "domain", "DOMAIN-SUFFIX": "domain_suffix",
              "DOMAIN-KEYWORD": "domain_keyword", "DOMAIN-REGEX": "domain_regex",
              "PROCESS-NAME": "process_name", "IP-CIDR": "ip_cidr",
              "IP-CIDR6": "ip_cidr", "SRC-IP-CIDR": "source_ip_cidr",
              "DST-PORT": "port", "SRC-PORT": "source_port"
          }

          # 全局记录当前成功生成配置的名称
          VALID_NAMES = set()

          def download(url):
              print(f"Downloading: {url}")
              # 增加 3 次重试逻辑
              for attempt in range(3):
                  try:
                      r = requests.get(
                          url,
                          timeout=30,
                          headers={"User-Agent": "Mozilla/5.0"}
                      )
                      r.raise_for_status()
                      return r.text
                  except Exception as e:
                      print(f"Attempt {attempt + 1} failed: {e}")
                      if attempt == 2:
                          raise
                      time.sleep(1)

          def parse_json(content):
              try:
                  data = json.loads(content)
                  if isinstance(data, dict):
                      if "rules" in data: return data["rules"]
                      if "payload" in data: return data["payload"]
                  if isinstance(data, list):
                      return data
              except Exception:
                  pass
              return None

          def parse_yaml(content):
              try:
                  data = yaml.safe_load(content)
                  if isinstance(data, dict):
                      if "payload" in data: return data["payload"]
                      if "rules" in data: return data["rules"]
                  if isinstance(data, list):
                      return data
              except Exception:
                  pass
              return None

          def parse_text(content):
              return [
                  line.strip() for line in content.splitlines()
                  if line.strip() and not line.strip().startswith("#")
              ]

          def parse_content(content):
              rules = parse_json(content)
              if rules is not None:
                  print("Detected: JSON")
                  return rules

              rules = parse_yaml(content)
              if rules is not None:
                  print("Detected: YAML")
                  return rules

              print("Detected: TXT")
              return parse_text(content)

          def add_rule(rule_dict, rule_type, value):
              if not value: return
              key = MAPPING.get(rule_type.upper())
              if not key: return
              rule_dict.setdefault(key, []).append(value)

          def convert_rules(rules):
              site_rules = {}
              ip_rules = {}

              for item in rules:
                  if isinstance(item, dict):
                      for key, value in item.items():
                          if key in SITE_KEYS:
                              if isinstance(value, list):
                                  site_rules.setdefault(key, []).extend(value)
                              else:
                                  site_rules.setdefault(key, []).append(value)
                          elif key in IP_KEYS:
                              if isinstance(value, list):
                                  ip_rules.setdefault(key, []).extend(value)
                              else:
                                  ip_rules.setdefault(key, []).append(value)
                      continue

                  if not isinstance(item, str): continue
                  line = item.strip()
                  if not line or line.startswith("#"): continue

                  parts = [x.strip() for x in line.split(",")]
                  rule_type = parts[0].upper()

                  if rule_type in MAPPING:
                      if len(parts) < 2: continue
                      value = parts[1].strip()
                      if not value: continue

                      if rule_type in {"IP-CIDR", "IP-CIDR6", "SRC-IP-CIDR"}:
                          add_rule(ip_rules, rule_type, value)
                      else:
                          add_rule(site_rules, rule_type, value)
                      continue

                  if "." in line and "," not in line and "/" not in line:
                      site_rules.setdefault("domain_suffix", []).append(line)

              return site_rules, ip_rules

          def save_json(path, rules):
              if not rules:
                  return False

              cleaned_rules = {}
              for key in rules:
                  # 去重
                  unique_values = list(dict.fromkeys(rules[key]))
                  # 过滤空列表
                  if unique_values:
                      cleaned_rules[key] = unique_values

              if not cleaned_rules:
                  return False

              data = {
                  "version": 2,
                  "rules": [cleaned_rules]
              }

              with open(path, "w", encoding="utf-8") as f:
                  json.dump(data, f, indent=2, ensure_ascii=False)
              return True

          def process(name, url, mode="split"):
              print(f"\n{'=' * 60}\nProcessing: {name}\nMode: {mode}\n{'=' * 60}")
              
              try:
                  content = download(url)
              except Exception as e:
                  print(f"Download failed: {e}")
                  return

              try:
                  rules = parse_content(content)
                  if not rules:
                      print(f"[{name}] No rules found")
                      return

                  print(f"[{name}] Raw rules: {len(rules)}")
                  site_rules, ip_rules = convert_rules(rules)
                  
                  success = False

                  # 修复: 彻底分离地保存 site_rules 和 ip_rules，不再使用错误的混合写入
                  if save_json(f"{SITE_DIR}/{name}.json", site_rules):
                      print(f"[{name}] Geosite JSON generated")
                      success = True

                  if save_json(f"{IP_DIR}/{name}.json", ip_rules):
                      print(f"[{name}] GeoIP JSON generated")
                      success = True
                  
                  # 修复: 只有在下载与生成成功后，才将名称添加到白名单，避免因错误留下陈旧文件
                  if success:
                      VALID_NAMES.add(name)

              except Exception as e:
                  print(f"[{name}] Processing error: {e}")

          def process_config_file(path):
              print(f"\n### Config: {path}")
              mode = "mixed" if os.path.basename(path) == "subscriptions.txt" else "split"

              try:
                  with open(path, "r", encoding="utf-8") as f:
                      lines = f.readlines()
              except Exception as e:
                  print(f"Cannot read {path}: {e}")
                  return

              for line in lines:
                  line = line.strip()
                  if not line or line.startswith("#"):
                      continue
                  if "," in line:
                      name, url = line.split(",", 1)
                  elif "=" in line:
                      name, url = line.split("=", 1)
                  else:
                      continue

                  name = name.strip()
                  url = url.strip()
                  if not name or not url:
                      continue

                  process(name, url, mode)

          def cleanup_obsolete_files():
              print("\n=== Cleanup Obsolete Files ===")
              for directory in [SITE_DIR, IP_DIR]:
                  if not os.path.exists(directory):
                      continue
                  for filename in os.listdir(directory):
                      if filename.endswith(".json") or filename.endswith(".srs"):
                          base_name = os.path.splitext(filename)[0]
                          # 精准清理：只删除不在 VALID_NAMES 记录中的多余文件
                          if base_name not in VALID_NAMES:
                              filepath = os.path.join(directory, filename)
                              try:
                                  os.remove(filepath)
                                  print(f"Removed obsolete file: {filepath}")
                              except Exception as e:
                                  print(f"Failed to remove {filepath}: {e}")

          # ================= 执行逻辑 =================
          
          files = sorted(
              f for f in os.listdir(".")
              if f.startswith("subscriptions") and f.endswith((".txt", ".yaml", ".yml"))
          )

          print(f"Found config files: {files}")

          for file in files:
              process_config_file(file)

          cleanup_obsolete_files()

          PY

          python convert.py

      - name: Compile JSON to SRS
        run: |
          for DIR in "sing-box/geosite" "sing-box/geoip"; do
            if [ -d "$DIR" ]; then
              for file in "$DIR"/*.json; do
                if [ -f "$file" ]; then
                  name=$(basename "$file" .json)
                  echo "Compiling: $file"
                  # 修复: 增加 || 逻辑，某一个文件编译失败只会提示，不直接中断整个工作流
                  sing-box rule-set compile "$file" -o "$DIR/${name}.srs" || echo "Warning: failed to compile $file"
                fi
              done
            fi
          done

      - name: Commit and Push Changes
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # 记录文件的修改、新增以及精准删除状态
          git add -A sing-box/geosite/ sing-box/geoip/

          if git diff --cached --quiet; then
            echo "No changes detected, skipping commit."
            exit 0
          fi

          git commit -m "Auto-update rule sets and cleanup obsolete files [skip ci]"
          git push origin main
          echo "Changes pushed successfully."
